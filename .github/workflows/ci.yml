name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Swift 6.4 ships only with Xcode 27, which only the xcode-27 image has.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Check toolchain
        run: |
          swift --version
          swift --version 2>&1 | grep -q "Swift version 6.4" \
            || { echo "::error::Package.swift needs Swift 6.4; DEVELOPER_DIR selects another toolchain"; exit 1; }

      # Pinned so a new SwiftFormat release with new default rules can't turn CI red on its own.
      # Bump --minversion in .swiftformat with SWIFTFORMAT_VERSION, so local lint runs the same rules.
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.64.0
          SWIFTFORMAT_SHA256: 95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftformat --lint .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build README snippets
        run: scripts/check-readme-snippets.sh

      - name: Install Periphery
        env:
          PERIPHERY_VERSION: 3.8.0
          PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/periphery.zip" \
            "https://github.com/peripheryapp/periphery/releases/download/$PERIPHERY_VERSION/periphery-$PERIPHERY_VERSION.zip"
          echo "$PERIPHERY_SHA256  $RUNNER_TEMP/periphery.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/periphery.zip" -d "$RUNNER_TEMP/periphery"
          echo "$RUNNER_TEMP/periphery" >> "$GITHUB_PATH"

      - name: Scan for unused code
        run: ./scan.sh
